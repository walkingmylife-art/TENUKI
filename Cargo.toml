[package]
name = "TENUKI"
version = "1.2.1"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
# GUI
egui = "0.29"
eframe = "0.29"

# HTTPクライアント（セットアップ時のダウンロード用）
reqwest = { version = "0.12", features = ["blocking", "json"] }

# ZIP展開
zip = { version = "2.0", default-features = false, features = ["deflate"] }

# Async runtime
tokio = { version = "1.50", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
futures = "0.3"

walkdir = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1"
csv = "1.3"

# Text processing
regex = "1.10"
urlencoding = "2.1"
encoding_rs = "0.8"

# Error handling
anyhow = "1"

# Logging
env_logger = "0.11"
log = "0.4"

# File dialogs
rfd = "0.14"

# Misc
once_cell = "1.19"
rustc-hash = "1"
open = "5"

# HTTP LLM client (TLS不要: localhost http のみ使用)
ureq = { version = "2.9", default-features = false, features = ["json"] }
dashmap = "6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_Graphics_Dxgi",
] }

[features]
dxgi = []

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

